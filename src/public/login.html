<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · wallet-auth</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-sans-serif, system-ui, sans-serif; background:#0b0e14; color:#e6e6e6; margin:0; }
  main { max-width: 480px; margin: 4rem auto; padding: 0 1rem; }
  h1 { font-size: 1.3rem; }
  button { display:block; width:100%; margin:.6rem 0; padding:.9rem 1rem; font-size:1rem;
           background:#1c2333; color:#e6e6e6; border:1px solid #2a3447; border-radius:10px; cursor:pointer; }
  button:hover:not(:disabled) { background:#242e42; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #status { min-height:1.5rem; font-size:.85rem; color:#9aa5b5; }
  a { color:#7aa2f7; }
</style>
</head>
<body>
<main>
  <h1>Sign in with a wallet</h1>
  <div id="status"></div>
  <button id="btn-siwe">🦊 Ethereum (SIWE)</button>
  <button id="btn-nostr">⚡ Nostr (NIP-98)</button>
  <button id="btn-solana">☀️ Solana (Phantom)</button>
  <p><a href="/">← back</a></p>
</main>
<script src="/vendor/ethers.umd.min.js"></script>
<script type="module">
  import { setTokenCookie } from '/app.js';
  import {
    collectAnnouncedProviders, legacyProviders, evmCandidates,
    connectFirstWallet, demotePhantomEvm, buildSiweMessage, solanaCandidates,
  } from '/wallet-core.js';

  // Minimal base58 (Bitcoin alphabet) encoder — enough for Phantom signatures.
  const B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
  function toBase58(bytes) {
    let digits = [0];
    for (const byte of bytes) {
      let carry = byte;
      for (let j = 0; j < digits.length; j++) {
        carry += digits[j] << 8;
        digits[j] = carry % 58;
        carry = (carry / 58) | 0;
      }
      while (carry > 0) { digits.push(carry % 58); carry = (carry / 58) | 0; }
    }
    let out = '';
    for (let i = 0; bytes[i] === 0 && i < bytes.length - 1; i++) out += '1';
    for (let i = digits.length - 1; i >= 0; i--) out += B58[digits[i]];
    return out;
  }

  const status = (msg) => (document.getElementById('status').textContent = msg);
  const params = new URLSearchParams(location.search);
  const next = params.get('next') || '/';
  const cfg = await (await fetch('/config')).json();
  const origin = cfg.publicUrl || window.location.origin;

  async function finish(data) {
    if (!data.valid) return status(`✗ ${data.error || 'verification failed'}`);
    setTokenCookie(data.token);
    location.href = next.startsWith(origin) ? next : '/';
  }

  const fail = (label) => (e) => status(`✗ ${e?.message || label || 'unexpected error'}`);
  const isRejected = (err) => err?.code === 4001
    || /reject/i.test(err?.message || '')
    || err?.code === 'ACTION_REJECTED';

  // ---------- Ethereum (SIWE / EIP-4361) ----------
  // Full attempt-loop: EACH wallet gets its own connect->sign->verify shot,
  // so one misbehaving extension never blocks the others. ?debug=1 surfaces
  // the exact failing step and JSON-RPC error object in the status line.
  document.getElementById('btn-siwe').onclick = async () => {
    const debug = new URLSearchParams(location.search).has('debug');
    const dbg = [];
    try {
      status('discovering wallets…');
      const announced = await collectAnnouncedProviders(window);
      const cands = evmCandidates(announced, legacyProviders(window));
      if (!cands.length) {
        return status('✗ No Ethereum extension found (MetaMask / OKX / Rabby / Talisman…)');
      }
      dbg.push(`wallets=${cands.map((c) => c.name).join(',')}`);
      if (debug) { status(`[debug] ${dbg[0]}`); await new Promise((r) => setTimeout(r, 1500)); }

      for (const c of demotePhantomEvm(cands)) {
        try {
          dbg.push(c.name);
          if (debug) status(`[debug] ${dbg.join(' → ')}`);
          const accounts = await c.provider.request({ method: 'eth_requestAccounts' });
          const raw = accounts?.[0];
          if (!raw) { errs.push(`${c.name}: returned no account`); continue; }
          const address = ethers.getAddress(raw);   // checksummed everywhere
          // Best-effort chain switch; some wallets refuse to sign on
          // networks they consider disabled for the origin.
          await c.provider.request({
            method: 'wallet_switchEthereumChain', params: [{ chainId: '0x1' }],
          }).catch(() => {});
          const nonceRes = await fetch('/auth/siwe/nonce', { method: 'POST' });
          const { nonce } = await nonceRes.json();
          const message = buildSiweMessage({ origin, address, nonce });
          const msgHex = ethers.hexlify(ethers.toUtf8Bytes(message));
          const signature = await c.provider.request({
            method: 'personal_sign',
            params: [msgHex, address],
          });
          const res = await fetch('/auth/siwe/verify', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ message, signature }),
          });
          return finish(await res.json());
        } catch (err) {
          if (isRejected(err)) return status('✗ request rejected in wallet');
          errs.push(`${c.name}: ${err.message || String(err)}${err?.code != null ? ` (code ${err.code})` : ''}`);
          if (debug) {
            dbg.push(`ERR:${err.message || err}`);
            status(`[debug] ${dbg.join(' → ')}`);
            console.error('[wallet-auth debug]', c.name, err);
          }
        }
      }
      throw new Error(errs.join(' | ') || 'no wallet completed signing');
    } catch (e) { fail()(e); }
  };

  // ---------- Nostr (NIP-98) ----------
  document.getElementById('btn-nostr').onclick = async () => {
    try {
      if (!window.nostr) throw new Error('No Nostr extension found (Alby / nos2x)');
      status('check your extension…');
      // Build the NIP-98 event manually; window.nostr.signEvent fills id/pubkey/sig.
      const event = await window.nostr.signEvent({
        kind: 27235,
        created_at: Math.floor(Date.now() / 1000),
        tags: [['u', `${origin}/auth/nostr`], ['method', 'POST']],
        content: '',
      });
      const token = `Nostr ${btoa(JSON.stringify(event))}`;
      const res = await fetch('/auth/nostr/verify', {
        method: 'POST',
        headers: { authorization: token },
      });
      finish(await res.json());
    } catch (e) { fail('Nostr error')(e); }
  };

  // ---------- Solana ----------
  // Wallet-Standard first (wallets register themselves via
  // 'register:wallet' — no window-property squatting possible), then the
  // classic injection points. Every wallet-specific call is wrapped so raw
  // extension errors never reach the UI unprefixed; each candidate gets a
  // full connect->nonce->sign->verify attempt.
  document.getElementById('btn-solana').onclick = async () => {
    const debug = new URLSearchParams(location.search).has('debug');
    const dbg = [];
    const log = (m) => { dbg.push(m); if (debug) status(`[debug] ${dbg.join(' → ')}`); };
    try {
      let registered = [];
      try {
        if (Array.isArray(window.phantom?.solana?._wallets)) registered = [...window.phantom.solana._wallets];
      } catch { /* non-standard layout */ }
      const candidates = [
        ...registered.map((w, i) => ({ p: w, name: w.name || `registered-wallet-${i}`, tag: 'standard' })),
        ...solanaCandidates(window).map((p) => ({
          p,
          name: p.isPhantom ? 'Phantom' : (p.isSolflare ? 'Solflare' : 'Solana wallet'),
          tag: 'injected',
        })),
      ];
      if (!candidates.length) throw new Error('No Solana wallet found (install Phantom or Solflare)');
      status(`connecting… (${candidates.length} found)`);
      const errors = [];
      let done = false;
      for (const c of candidates) {
        const name = c.name;
        const label = `${name}[${c.tag}${c.p.isConnected === false ? ',unconnected' : ''}]`;
        try {
          log(label);
          status(`check ${name}…`);
          // connect(): best-effort — a user rejection stops the flow; other
          // failures are logged and signing is still attempted.
          try {
            await c.p.connect();
          } catch (err) {
            if (isRejected(err)) throw new Error(`${name}: connection rejected`);
            log(`${name}.connect:${String(err?.message || err).slice(0, 60)}`);
          }
          const nonceRes = await fetch('/auth/solana/nonce', { method: 'POST' });
          if (!nonceRes.ok) throw new Error(`${name}: nonce endpoint HTTP ${nonceRes.status}`);
          const { nonce } = await nonceRes.json();
          const message = `Sign in to wallet-auth\nNonce: ${nonce}`;
          let signed;
          try {
            signed = await c.p.signMessage(new TextEncoder().encode(message), 'utf8');
          } catch (err1) {
            // One recovery shot: reconnect then sign again — covers a dead
            // session left by an earlier connect hiccup (-32603 case).
            log(`${name}.sign:${String(err1?.message || err1).slice(0, 40)}→retry`);
            try {
              await c.p.connect();
              signed = await c.p.signMessage(new TextEncoder().encode(message), 'utf8');
              log(`${name}.recovered`);
            } catch (err2) {
              const msg = String(err2?.message || err2);
              const hint = /unexpected error/i.test(msg)
                ? ' — update or reinstall this wallet extension and retry'
                : '';
              throw new Error(`${name}: sign failed — ${msg}${hint}`);
            }
          }
          // Newer wallets return {signature, publicKey}; older just the bytes.
          const rawSig = signed?.signature ?? signed;
          const pubkeyStr = (signed?.publicKey ?? c.p.publicKey)?.toString?.();
          if (!pubkeyStr) throw new Error(`${name}: no public key returned`);
          const res = await fetch('/auth/solana/verify', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              pubkey: pubkeyStr,
              message,
              signature: toBase58(rawSig),
            }),
          });
          const body = await res.json();
          if (!body.valid) throw new Error(`${name}: ${body.error || 'verification failed'}`);
          finish(body);
          done = true;
          break;
        } catch (err) {
          if (/rejected/i.test(err?.message || '')) return status(`✗ ${err.message}`);
          errors.push(err.message);
          log(`ERR:${err.message}`);
          console.error('[wallet-auth solana]', c.p, err);
        }
      }
      if (!done) throw new Error(errors.join(' | ') || 'no Solana wallet completed signing');
    } catch (e) { fail()(e); }
  };
</script>
</body>
</html>
